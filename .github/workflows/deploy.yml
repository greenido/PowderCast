name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth, shared with ci.yml and local `nvm use`.
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Pull requests are gated by ci.yml; this is the gate on main itself, so
      # a direct push or an unreviewed merge cannot deploy a broken build.
      - name: Typecheck
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

      - name: Build Next.js static export
        run: yarn build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name != github.repository_owner.github.io && format('/{0}', github.event.repository.name) || '' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
